version: "2"
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - containedctx
    - contextcheck
    - copyloopvar
    - decorder
    - dogsled
    - dupword
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - godox
    - goheader
    - gomoddirectives
    - gosec
    - grouper
    - loggercheck
    - misspell
    - nilerr
    - nilnil
    - noctx
    - nosprintfhostport
    - paralleltest
    - prealloc
    - predeclared
    - reassign
    - revive
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace
  settings:
    exhaustive:
      default-signifies-exhaustive: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # jennifer's DSL is written with a dot import, and the generator repeats
      # Go type and identifier names as literals.
      - path: v2/cmd/configulator/(gen|gen_\w+|load|main|markdown_file|model)\.go$
        linters:
          - goconst
      - path: v2/cmd/configulator/
        linters:
          - revive
          - staticcheck
        text: should not use dot imports
      # Generated source is written world-readable like any other source file.
      - path: v2/cmd/configulator/main\.go$
        linters:
          - gosec
        text: G306
      # The hook registry is process-wide by design.
      - path: v2/internal/seam/seam\.go$
        linters:
          - gochecknoglobals
    paths:
      - .*_configulator\.go$
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
  exclusions:
    generated: lax
    paths:
      - .*_configulator\.go$
      - third_party$
      - builtin$
      - examples$
