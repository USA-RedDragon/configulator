name: v2

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: 'v2 @ ${{ github.ref }}'
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTO_COMMIT_APP_ID }}
          private-key: ${{ secrets.AUTO_COMMIT_APP_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: v2/go.mod
      - name: Test runtime, generator and conformance corpus
        run: |
          cd v2
          go test -race -count=1 -covermode atomic -coverpkg=./... -coverprofile coverage.raw ./...
          grep -v -e '_configulator\.go:' -e '/internal/conformance/' coverage.raw > coverage.out
      - uses: USA-RedDragon/reusable-actions/coverage@c7f24b7a3dc1110838186b173b1f1a2a65ff1c91 # v2.0.22
        with:
          file: v2/coverage.out
          badge: .github/badges/coverage-v2.svg
          baseline: .github/coverage-baseline-v2.tsv
          label: v2 coverage
          marker: coverage-v2
          token: ${{ steps.app-token.outputs.token }}
          git-user-name: usa-reddragon-auto-commit-bot[bot]
          git-user-email: usa-reddragon-auto-commit-bot[bot]@users.noreply.github.com
      - name: Build examples
        run: |
          for d in v2/examples/*/; do
            (cd "$d" && go build ./...)
          done

  generate-and-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: v2/go.mod
      - name: Regenerate everything; committed output must not drift
        run: |
          cd v2/internal/conformance
          for T in Scalars Nested Collections NestedCollections Optionals Embedded Durations; do
            go run github.com/USA-RedDragon/configulator/v2/cmd/configulator \
              -type "$T" -output "$(echo "$T" | tr '[:upper:]' '[:lower:]')_configulator.go"
          done
          cd ../..
          for d in examples/*/; do (cd "$d" && go generate ./...); done
          git diff --exit-code
